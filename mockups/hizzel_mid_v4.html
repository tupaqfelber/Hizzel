<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hizzel — Mid State v2</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#E0DCD4;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'DM Sans',sans-serif;}
.phone{width:375px;height:812px;background:#F5F2EC;border-radius:44px;border:1.5px solid #D6D0C4;overflow:hidden;position:relative;display:flex;}

/* LEFT: Things half, unchanged in spirit from before, just narrower */
.things-half{width:50%;height:100%;background:#F5F2EC;display:flex;flex-direction:column;overflow:hidden;}
.t-header{padding:52px 16px 10px;display:flex;align-items:flex-start;gap:8px;flex-shrink:0;}
.t-logo{width:26px;height:26px;object-fit:contain;mix-blend-mode:multiply;margin-top:1px;}
.t-title{font-family:'DM Serif Display',serif;font-size:17px;color:#2C2A25;line-height:1;}
.t-sub{font-size:9px;color:#B0A898;margin-top:2px;}
.t-cats{display:flex;gap:5px;padding:0 12px 12px;align-items:center;flex-shrink:0;overflow-x:auto;}
.t-search{width:24px;height:24px;background:#EAE7DF;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat{padding:5px 10px;border-radius:16px;font-size:9px;font-weight:500;white-space:nowrap;flex-shrink:0;}
.cat-on{background:#2C2A25;color:#F5F2EC;}
.cat-off{background:#EAE7DF;color:#8A8378;}
.t-scroll{flex:1;overflow-y:auto;padding:0 12px 16px;}
.room-header{font-size:8px;font-weight:500;color:#A09890;letter-spacing:0.08em;text-transform:uppercase;padding:8px 0 6px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:4px;}
.card{border-radius:9px;overflow:hidden;background:#EDEAE2;position:relative;}
.card-img{width:100%;aspect-ratio:0.85;display:flex;align-items:center;justify-content:center;}
.card-info{padding:5px 6px 6px;border-top:0.5px solid rgba(44,42,37,0.06);}
.card-name{font-size:9px;font-weight:500;color:#2C2A25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-dim{font-size:8px;color:#A09890;margin-top:1px;}

/* RIGHT: the new Mid drawer-half */
.hizzel-half{width:50%;height:100%;background:#1E1C16;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.h-header{padding:52px 14px 10px;display:flex;align-items:flex-start;gap:8px;flex-shrink:0;}
.h-logo{width:26px;height:26px;object-fit:contain;margin-top:1px;}
.h-title{font-family:'DM Serif Display',serif;font-size:17px;color:#F0EDE6;line-height:1;}
.h-sub{font-size:9px;color:#7A7670;margin-top:2px;}

/* The thumbnail plan — tappable button to full Hizzel, also a magical drop target */
.thumb-wrap{margin:6px 14px 12px;flex-shrink:0;}
.thumb-label{font-size:9px;font-weight:500;color:rgba(240,237,230,0.65);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
.thumb-label span{display:flex;align-items:center;gap:3px;background:rgba(240,237,230,0.07);border:0.5px solid rgba(240,237,230,0.1);border-radius:8px;padding:3px 7px;}
.thumb-tap-hint{font-size:8px;color:#5C574F;font-style:italic;}
.thumb{background:rgba(240,237,230,0.04);border:1px solid rgba(240,237,230,0.14);border-radius:12px;height:110px;position:relative;overflow:hidden;}
.thumb-room{position:absolute;border:1px solid rgba(240,237,230,0.3);border-radius:1px;}
.thumb-blk{position:absolute;border-radius:1.5px;}
.thumb-tap-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:6px;}
.thumb-expand{width:20px;height:20px;border-radius:50%;background:rgba(240,237,230,0.12);display:flex;align-items:center;justify-content:center;color:rgba(240,237,230,0.65);font-size:10px;}

/* Divider between thumb and drawer list */
.drawer-divider{height:1px;background:rgba(240,237,230,0.08);margin:0 14px;flex-shrink:0;}

.drawer-label{font-size:8px;font-weight:500;color:rgba(160,152,144,0.7);letter-spacing:0.1em;text-transform:uppercase;padding:10px 14px 6px;flex-shrink:0;}
.drawer-scroll{flex:1;overflow-y:auto;padding:0 14px 90px;display:flex;flex-direction:column;gap:6px;}
.tray-row{display:flex;align-items:center;gap:8px;background:rgba(240,237,230,0.05);border:0.5px solid rgba(240,237,230,0.1);border-radius:10px;padding:6px;cursor:grab;}
.tray-swatch{width:34px;height:34px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.tray-name{font-size:10px;font-weight:500;color:#E8E4DC;}
.tray-dim{font-size:8px;color:#7A7670;margin-top:1px;}

/* Bottom slider bar spanning both halves — matches old toggle's small centred proportions */
.slider-bar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;}
.slider-track{width:214px;height:38px;background:rgba(18,16,12,0.92);border-radius:19px;position:relative;display:flex;align-items:center;padding:4px;gap:2px;border:0.5px solid rgba(255,255,255,0.06);}
.slider-thumb{position:absolute;top:4px;left:calc(33.33% + 2px);width:calc(33.33% - 4px);height:30px;background:rgba(240,237,230,0.1);border-radius:15px;}
.slider-stop{flex:1;text-align:center;font-size:11px;font-weight:500;z-index:1;position:relative;padding:0 2px;}
.stop-things{color:rgba(240,237,230,0.38);font-family:'Playfair Display',serif;font-style:italic;font-size:13px;}
.stop-mid{color:rgba(240,237,230,0.78);}
.stop-hizzel{color:rgba(240,237,230,0.38);font-family:'DM Serif Display',serif;font-size:11px;letter-spacing:0.03em;}
.slider-mid-icon{display:flex;align-items:center;justify-content:center;gap:4px;}
.tri-left{width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-right:6px solid rgba(240,237,230,0.8);}
.tri-right{width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid rgba(240,237,230,0.8);}
</style>
</head>
