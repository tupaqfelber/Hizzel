<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hizzel — Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#3A3630;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'DM Sans',sans-serif;}
.phone{width:375px;height:812px;background:#1E1C16;border-radius:44px;border:1.5px solid #3A3630;overflow:hidden;position:relative;display:flex;flex-direction:column;}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 0;font-size:12px;color:#6A6460;font-weight:500;flex-shrink:0;position:relative;z-index:10;}
.header{padding:14px 20px 10px;display:flex;align-items:center;gap:12px;flex-shrink:0;position:relative;z-index:10;}
.logo-wrap{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo{width:38px;height:38px;object-fit:contain;}
.title-block{flex:1;}
.wordmark{font-size:9px;letter-spacing:0.14em;color:#6A6460;text-transform:uppercase;margin-bottom:2px;}
.prop-name{font-family:'DM Serif Display',serif;font-size:22px;color:#F0EDE6;letter-spacing:-0.3px;line-height:1;}
.floor-sub{font-size:11px;color:#7A7670;margin-top:3px;display:flex;align-items:center;gap:3px;cursor:pointer;}
.toolbar-row{display:flex;align-items:center;gap:5px;padding:0 20px 10px;flex-shrink:0;position:relative;z-index:10;}
.tool-btn{display:flex;align-items:center;gap:4px;padding:7px 14px;border-radius:10px;font-size:11px;font-weight:500;background:rgba(240,237,230,0.07);color:#B0ADA6;border:0.5px solid rgba(240,237,230,0.1);cursor:pointer;white-space:nowrap;}
.tool-search{width:40px;height:36px;justify-content:center;padding:0;flex-shrink:0;}
.tool-lock{width:36px;height:36px;justify-content:center;padding:0;flex-shrink:0;}
.canvas-area{flex:1;position:relative;overflow:hidden;}
.plan-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.plan-inner{position:relative;width:340px;height:100%;}
.compass{position:absolute;top:10px;right:10px;font-size:9px;color:rgba(240,237,230,0.2);font-weight:500;letter-spacing:0.1em;z-index:5;}
.room{position:absolute;border:1.5px solid rgba(240,237,230,0.4);background:rgba(30,28,22,0.92);overflow:hidden;border-radius:2px;}
.rlbl{font-size:6px;font-weight:500;color:rgba(220,215,205,0.4);letter-spacing:0.06em;text-transform:uppercase;position:absolute;top:3px;left:4px;white-space:nowrap;}
.blk{position:absolute;border-radius:3px;z-index:3;display:flex;align-items:flex-end;justify-content:flex-start;padding:3px 5px;}
.blk-lbl{font-size:6px;font-weight:500;color:rgba(255,255,255,0.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.toggle-bar{flex-shrink:0;height:74px;background:#1A1814;border-top:0.5px solid #3A3630;display:flex;align-items:center;justify-content:center;padding-bottom:10px;z-index:20;}
.toggle{display:flex;background:#2A2820;border-radius:28px;padding:3px;gap:2px;width:220px;}
.tab{flex:1;text-align:center;padding:8px 0;border-radius:22px;font-size:12px;font-weight:500;cursor:pointer;}
.tab-on{background:#F0EDE6;color:#1A1814;}
.tab-off{color:#6A6460;}
.tab-things{font-family:'Playfair Display',serif;font-style:italic;font-size:14px;}
.tab-hizzel{font-family:'DM Serif Display',serif;font-size:13px;letter-spacing:0.05em;}
</style>
</head>
