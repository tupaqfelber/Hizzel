<head>
<meta charset="UTF-8">
<title>Hizzel — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#E0DCD4;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'DM Sans',sans-serif;}
.phone{width:375px;height:812px;background:#F5F2EC;border-radius:44px;border:1.5px solid #D6D0C4;overflow:hidden;position:relative;display:flex;flex-direction:column;}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 0;font-size:12px;color:#8A8378;font-weight:500;flex-shrink:0;}
.content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px;}
.logo{width:64px;height:64px;object-fit:contain;mix-blend-mode:multiply;margin-bottom:24px;}
.wordmark{font-family:'DM Serif Display',serif;font-size:34px;color:#2C2A25;letter-spacing:-0.5px;margin-bottom:8px;}
.tagline{font-size:13px;color:#A09890;text-align:center;margin-bottom:48px;line-height:1.5;}
.field-label{font-size:10px;font-weight:500;color:#A09890;letter-spacing:0.1em;text-transform:uppercase;align-self:flex-start;margin-bottom:8px;}
.email-field{width:100%;background:#EAE7DF;border-radius:12px;padding:14px 16px;font-size:14px;color:#2C2A25;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.email-placeholder{color:#B0A898;}
.send-btn{width:100%;background:#2C2A25;border-radius:12px;padding:15px 0;text-align:center;color:#F5F2EC;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:20px;}
.helper{font-size:11px;color:#B0A898;text-align:center;line-height:1.6;}
.footer{padding:0 40px 40px;text-align:center;}
.footer-text{font-size:10px;color:#C4BFB3;line-height:1.6;}
</style>
</head>
