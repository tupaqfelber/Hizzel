<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hizzel — Add a Thing</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#E0DCD4;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'DM Sans',sans-serif;}
.phone{width:375px;height:812px;background:#F5F2EC;border-radius:44px;border:1.5px solid #D6D0C4;overflow:hidden;position:relative;display:flex;flex-direction:column;}
.behind{position:absolute;inset:0;background:#F5F2EC;filter:brightness(0.92);}
.behind-header{padding:52px 20px 10px;display:flex;align-items:center;gap:10px;opacity:0.5;}
.behind-logo{width:30px;height:30px;object-fit:contain;}
.behind-title{font-family:'DM Serif Display',serif;font-size:22px;color:#2C2A25;}
.scrim{position:absolute;inset:0;background:rgba(44,42,37,0.25);}
.sheet{position:absolute;left:0;right:0;bottom:0;top:90px;background:#F5F2EC;border-radius:26px 26px 0 0;box-shadow:0 -8px 40px rgba(26,24,20,0.18);display:flex;flex-direction:column;overflow:hidden;}
.grabber{width:36px;height:4px;background:#D6D0C4;border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 6px;flex-shrink:0;}
.sheet-title{font-family:'DM Serif Display',serif;font-size:21px;color:#2C2A25;}
.close{width:30px;height:30px;border-radius:50%;background:#EAE7DF;display:flex;align-items:center;justify-content:center;color:#8A8378;font-size:14px;cursor:pointer;}
.sheet-scroll{flex:1;overflow-y:auto;padding:6px 22px 20px;scrollbar-width:none;}
.photo-area{width:150px;aspect-ratio:0.75;border-radius:14px;overflow:hidden;margin:6px auto 16px;position:relative;background:#C0B8A8;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.photo-icon{font-size:44px;color:rgba(255,255,255,0.55);}
.photo-actions{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
.pa-btn{width:30px;height:30px;border-radius:50%;background:rgba(245,242,236,0.92);display:flex;align-items:center;justify-content:center;color:#5C574F;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.12);}
.field-label{font-size:10px;font-weight:500;color:#A09890;letter-spacing:0.1em;text-transform:uppercase;margin:14px 0 6px;}
.field-box{width:100%;background:#EAE7DF;border-radius:11px;padding:12px 14px;font-size:14px;color:#2C2A25;border:none;}
.placeholder{color:#B0A898;}
.pills{display:flex;flex-wrap:wrap;gap:6px;}
.pill{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;}
.pill-on{background:#2C2A25;color:#F5F2EC;}
.pill-off{background:#EAE7DF;color:#8A8378;}
.dims{display:flex;align-items:center;gap:8px;}
.dim-box{flex:1;background:#EAE7DF;border-radius:11px;padding:12px 0;text-align:center;font-size:14px;color:#2C2A25;}
.dim-x{color:#B0A898;font-size:13px;flex-shrink:0;}
.dim-unit{font-size:10px;color:#A09890;text-align:right;margin-top:4px;}
.notes-box{width:100%;background:#EAE7DF;border-radius:11px;padding:12px 14px;font-size:13px;color:#B0A898;min-height:64px;}
.cta-row{display:flex;gap:10px;padding:12px 22px 26px;flex-shrink:0;border-top:0.5px solid #E4E0D8;}
.btn{flex:1;text-align:center;padding:14px 0;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;}
.btn-ghost{color:#8A8378;border:1px solid #D6D0C4;}
.btn-solid{background:#2C2A25;color:#F5F2EC;}
</style>
</head>
